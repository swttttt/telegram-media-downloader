name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build portable package
        shell: pwsh
        run: ./build_release.ps1 -SkipInstall

      - name: Verify executable
        shell: pwsh
        run: |
          ./dist/TelegramMediaDownloader.exe --version
          ./dist/TelegramMediaDownloader.exe --lang en --help
          ./dist/TelegramMediaDownloader.exe --lang zh --help

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $zip = "./dist/TelegramMediaDownloader-v$version-windows-x64.zip"
          $checksum = "./dist/TelegramMediaDownloader-v$version-windows-x64.sha256"
          $notes = @"
          ## Telegram Media Downloader $tag

          - Portable Windows executable; no Python installation required
          - Chinese and English interfaces
          - Original-quality albums, videos, and discussion media
          - Parallel downloads, automatic retries, and integrity checks

          Download the ZIP, extract it, and run ``TelegramMediaDownloader.exe``.

          下载 ZIP 并解压，双击 ``start.bat`` 即可选择中文或 English。
          "@
          gh release create $tag `
            --title "Telegram Media Downloader $tag" `
            --notes $notes `
            ./dist/TelegramMediaDownloader.exe `
            $zip `
            $checksum
